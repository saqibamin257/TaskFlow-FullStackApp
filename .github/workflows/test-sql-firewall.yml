name: Test Azure SQL Firewall Access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test SQL Firewall Rule
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Runner IP
        id: ip
        run: |
          RUNNER_IP=$(curl -4 -s https://api.ipify.org)

          echo "GitHub Actions Runner IP: $RUNNER_IP"

          if [ -z "$RUNNER_IP" ]; then
            echo "Failed to determine runner IP."
            exit 1
          fi

          echo "ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"

      - name: Add Runner IP to Azure SQL Firewall
        run: |
          az sql server firewall-rule create \
            --resource-group rg-taskflow \
            --server taskflow-sqlserver-saqib \
            --name GitHubActionsRunner \
            --start-ip-address "${{ steps.ip.outputs.ip }}" \
            --end-ip-address "${{ steps.ip.outputs.ip }}"

      - name: Verify Firewall Rule
        run: |
          az sql server firewall-rule show \
            --resource-group rg-taskflow \
            --server taskflow-sqlserver-saqib \
            --name GitHubActionsRunner \
            --query "{name:name,startIp:startIpAddress,endIp:endIpAddress}" \
            --output table

      - name: Remove Runner IP from Azure SQL Firewall
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group rg-taskflow \
            --server taskflow-sqlserver-saqib \
            --name GitHubActionsRunner \
            --yes